<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <base href="/" />

  <!-- Primary SEO Meta Tags -->
  <title>Dead Matter - Ultimate Interactive Map, Wiki & Survival Guides</title>
  <!-- Hreflang Tags: Removed static tags pointing to root. They will be handled dynamically if needed. -->


  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">



  <!-- Open Graph (Facebook / Discord / WhatsApp) -->
  <meta data-react-helmet="true" property="og:type" content="website" />
  <meta data-react-helmet="true" property="og:url" content="https://deadmatterwiki.com/" />
  <meta data-react-helmet="true" property="og:title" content="Dead Matter - Interactive Map, Wiki & Survival Guides" />
  <meta data-react-helmet="true" property="og:description"
    content="Explore the ultimate Dead Matter Wiki: interactive map, weapons, crafting, loot systems, vehicles, zombies, guides and game updates." />
  <meta data-react-helmet="true" property="og:image"
    content="https://horizons-cdn.hostinger.com/783fa02e-1caf-48c3-baf6-d554d2d507fa/dead_matter_og_image.jpg" />
  <meta data-react-helmet="true" property="og:site_name" content="Dead Matter Wiki" />

  <!-- Twitter Cards -->
  <meta data-react-helmet="true" property="twitter:card" content="summary_large_image" />
  <meta data-react-helmet="true" property="twitter:url" content="https://deadmatterwiki.com/" />
  <meta data-react-helmet="true" property="twitter:title" content="Dead Matter - Interactive Map, Wiki & Survival Guides" />
  <meta data-react-helmet="true" property="twitter:description"
    content="The most complete community wiki for Dead Matter. Maps, crafting, weapons, loot, guides and more." />
  <meta data-react-helmet="true" property="twitter:image"
    content="https://horizons-cdn.hostinger.com/783fa02e-1caf-48c3-baf6-d554d2d507fa/dead_matter_twitter_card.jpg" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>


  <!-- Anti-cache meta tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
